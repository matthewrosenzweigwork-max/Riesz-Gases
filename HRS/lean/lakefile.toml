name = "HRS"
defaultTargets = ["HRS"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "HRS"

# Unmodified modules of the author's DGRHS-Lean project (see external/dgrhs/PROVENANCE.md).
[[lean_lib]]
name = "DGRHS"
srcDir = "external/dgrhs"
roots = ["DGRHS.Attractive.SourceUniform"]
globs = ["DGRHS.+"]
leanOptions = { autoImplicit = true }
